name: Python tests

on:
  push:
    branches: [main, feature/read-only-backup-v1]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and runtime dependencies
        run: python -m pip install -e .
      - name: Verify installed package and CLI
        run: |
          python -c "import ouman_eh203; import ouman_eh203.reference"
          ouman-eh203 metadata --lang fi --key l1_supply_min > /dev/null
      - name: Run unit tests (no serial hardware required)
        run: python -m unittest discover -s tests -v
